[tools]
node = "26.10.0"
python = "3.12.16"
ruff = "0.11.13"
actionlint = "1.7.12"
"npm:@fission-ai/openspec" = "1.14.0"

[tasks.lint]
description = "Lint appliance scripts and GitHub workflows"
run = ["ruff check scripts tests", "actionlint"]

[tasks."spec:validate"]
description = "Validate all OpenSpec artifacts strictly"
run = "openspec validate --all --strict --no-interactive"
